# ─────────────────────────────────────────────────────────
# 로컬 비밀 설정 예시 파일
#
#   1. 이 파일을 같은 위치에 application-local.yml 로 복사
#        Windows : copy application-local.example.yml application-local.yml
#        macOS   : cp application-local.example.yml application-local.yml
#   2. 아래 값을 내 PC 에 맞게 채우기
#
# application-local.yml 은 .gitignore 에 등록되어 있어 GitHub 에 올라가지 않습니다.
# (같은 이름의 환경 변수를 설정해도 됩니다)
# ─────────────────────────────────────────────────────────

# 내 PC MySQL root(또는 전용 계정) 비밀번호
DB_PASSWORD: your-mysql-password

# 다른 계정/주소를 쓸 때만 주석 해제
# DB_USERNAME: root
# DB_URL: jdbc:mysql://localhost:3306/bookcanvas?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&createDatabaseIfNotExist=true

# 도서 검색(+ 버튼 → 책 검색)에 쓰는 카카오 REST API 키 (선택, 비워 두면 직접 입력만 가능)
#   https://developers.kakao.com/console/app → 앱 만들기 → 앱 → 플랫폼 키 → REST API 키
# KAKAO_REST_API_KEY: your-kakao-rest-api-key

# JWT 서명 키: Base64 로 인코딩된 32바이트 이상의 무작위 값 (팀원마다 달라도 됨)
#   PowerShell : [Convert]::ToBase64String((1..32 | % { Get-Random -Max 256 }))
#   macOS/Linux: openssl rand -base64 32
JWT_SECRET: replace-with-your-own-base64-secret
